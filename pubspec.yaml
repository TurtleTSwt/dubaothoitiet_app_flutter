name: dubaothoitiet_ck_ltnc
description: "Ứng dụng dự báo thời tiết - Đồ án cuối kỳ"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_bloc: ^8.1.5
  equatable: ^2.1.0

  # Networking
  dio: ^5.4.3

  # Either<Failure, T> cho Repository pattern
  dartz: ^0.10.1

  # Local storage
  shared_preferences: ^2.2.3

  # Location
  geolocator: ^12.0.0
  permission_handler: ^11.3.1

  # Dependency Injection
  get_it: ^7.7.0

  # Kiểm tra kết nối mạng
  connectivity_plus: ^6.0.3

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true